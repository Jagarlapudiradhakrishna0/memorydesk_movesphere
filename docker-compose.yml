services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: memorydesk-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - memorydesk-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: memorydesk-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - memorydesk-net

networks:
  memorydesk-net:
    driver: bridge
